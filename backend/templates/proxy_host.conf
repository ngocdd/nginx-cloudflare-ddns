{% include "_header_comment.conf" %}

{% if enabled %}

{% include "_hsts_map.conf" %}

{% if passwords and passwords.length > 0 %}
# Per-domain password file map (host -> htpasswd file)
map $host $password_file_{{ id }} {
    default "";
{% for p in passwords %}
    {{ p.domain }} /data/proxy_host_passwords/{{ id }}/{{ p.domain }}.htpasswd;
{% endfor %}
}
{% endif %}

server {
  set $forward_scheme {{ forward_scheme }};
  set $server         "{{ forward_host }}";
  set $port           {{ forward_port }};

{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_assets.conf" %}
{% include "_exploits.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

{% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;
{% endif %}

  access_log /data/logs/proxy-host-{{ id }}_access.log proxy;
  error_log /data/logs/proxy-host-{{ id }}_error.log warn;

{% if passwords and passwords.length > 0 %}
  # Custom 401 page for password protection (rewrites auth_basic dialog to our HTML page)
  error_page 401 = @ph_pw_page_{{ id }};
{% endif %}

{{ advanced_config }}

{{ locations }}

{% if use_default_location %}

  location / {

{% include "_access.conf" %}
{% include "_password.conf" %}
{% include "_hsts.conf" %}

    {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    {% endif %}

    # Proxy!
    include conf.d/include/proxy.conf;
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

{% if passwords and passwords.length > 0 %}
# Internal location that serves the custom password HTML page on 401.
# The page is generated per-host at /data/proxy_host_passwords/page/<id>.html.
location @ph_pw_page_{{ id }} {
    internal;
    root /data/proxy_host_passwords/page;
    try_files /{{ id }}.html =401;
}
{% endif %}
{% endif %}
