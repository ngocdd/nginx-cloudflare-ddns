# Nginx Proxy Manager with Cloudflare DDNS
# https://github.com/ngocdd94/nginx-ddns
#
# Quick start:
#   make up          # start the container in detached mode
#   make logs        # follow container logs
#   make down        # stop the container
#
# Optional: copy .env.example to .env to override ports, image tag,
# disable IPv6, or inject Cloudflare API tokens.

services:
  npm-ddns:
    # Override the image tag via the IMAGE_TAG env var (e.g. IMAGE_TAG=v2.14.0)
    image: ngocdd94/nginx-ddns:${IMAGE_TAG:-latest}
    container_name: npm-ddns
    pull_policy: always
    restart: unless-stopped
    # Graceful shutdown window so s6-overlay can stop supervised services
    stop_grace_period: 30s

    ports:
      # Override host ports by setting HTTP_PORT / ADMIN_PORT / HTTPS_PORT in .env
      - "${HTTP_PORT:-80}:80"     # HTTP
      - "${ADMIN_PORT:-81}:81"    # Admin UI
      - "${HTTPS_PORT:-443}:443"  # HTTPS

    volumes:
      # Persistent app data (database, custom NPM configs, DDNS state)
      - ./data:/data
      # Let's Encrypt / custom certificates
      - ./letsencrypt:/etc/letsencrypt

    environment:
      # SQLite database location (must live under /data for persistence)
      DB_SQLITE_FILE: "/data/database.sqlite"
      # Toggle IPv6 support — set DISABLE_IPV6=true in .env to disable
      DISABLE_IPV6: "${DISABLE_IPV6:-false}"
      # Clickjacking protection header
      X_FRAME_OPTIONS: "${X_FRAME_OPTIONS:-deny}"

    # Optional .env file for secrets (e.g. DB_MYSQL_*, Cloudflare tokens, ...)
    # File is allowed to be missing — only set required: false on compose v2.20+
    env_file:
      - path: ./.env
        required: false

    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Give the container up to 60s on first start for DB migrations / cert bootstrap
      start_period: 60s

    logging:
      # Cap logs at 10 MiB × 3 files so a runaway log can't fill the host disk
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      # Prevent privilege escalation inside the container
      - no-new-privileges:true